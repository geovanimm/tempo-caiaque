<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempo Pesca de Caiaque</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --azul-escuro: #0b3d5c;
    --azul-claro: #1a7cb8;
  }

  body {
    margin: 0;
    font-family: "Nunito", Arial, sans-serif;
    background: #eef1f5;
    color: #1c2733;
  }

  header {
    background: linear-gradient(135deg, var(--azul-escuro), var(--azul-claro));
    color: white;
    padding: 18px 18px 34px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 4px 18px rgba(11, 61, 92, .3);
    position: relative;
    z-index: 1;
  }

  header h1 {
    margin: 0;
    font-size: clamp(20px, 5.5vw, 25px);
    font-weight: 800;
    letter-spacing: -.01em;
    line-height: 1.15;
  }

  .botao-menu {
    background: rgba(255, 255, 255, .12);
    border: none;
    color: white;
    font-size: 20px;
    line-height: 1;
    padding: 10px 13px;
    border-radius: 12px;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .botao-menu:hover {
    background: rgba(255, 255, 255, .22);
  }

  .overlay-menu {
    position: fixed;
    inset: 0;
    background: rgba(6, 20, 31, .5);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    z-index: 30;
  }

  .overlay-menu.aberto {
    opacity: 1;
    pointer-events: auto;
  }

  .menu-locais {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    width: 270px;
    max-width: 80vw;
    background: white;
    box-shadow: 4px 0 24px rgba(0, 0, 0, .2);
    transform: translateX(-100%);
    transition: transform .28s ease;
    z-index: 31;
    padding: 26px 16px;
    overflow-y: auto;
    border-radius: 0 22px 22px 0;
  }

  .menu-locais.aberto {
    transform: translateX(0);
  }

  .menu-locais-titulo {
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: #8892a0;
    margin: 0 0 14px 10px;
  }

  .local-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 14px;
    margin-bottom: 6px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    color: #1c2733;
    cursor: pointer;
    transition: background .15s;
  }

  .local-item::before {
    content: "📍";
    font-size: 15px;
  }

  .local-item:hover {
    background: #f0f4f8;
  }

  .local-item.ativo {
    background: linear-gradient(135deg, var(--azul-escuro), var(--azul-claro));
    color: white;
    box-shadow: 0 4px 12px rgba(11, 61, 92, .35);
  }

  .container {
    max-width: 900px;
    margin: -18px auto 0;
    padding: 0 12px 16px;
    position: relative;
    z-index: 2;
  }

  .lugar {
    background: white;
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(11, 61, 92, .14);
  }

  .lugar h2 {
    margin: 0 0 14px;
    font-size: 20px;
    font-weight: 800;
    color: var(--azul-escuro);
  }

  .lugar h2::before {
    content: "📍 ";
  }

  .agora {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    background: linear-gradient(135deg, #e7f1f9, #dcecf7);
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 22px;
  }

  .agora .bloco {
    text-align: center;
    background: white;
    border-radius: 12px;
    padding: 10px 4px;
    box-shadow: 0 2px 8px rgba(11, 61, 92, .08);
    min-width: 0;
  }

  .agora .bloco .rotulo {
    font-size: 10px;
    color: #7a8794;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .03em;
    overflow-wrap: break-word;
  }

  .agora .bloco .valor {
    font-size: 19px;
    font-weight: 800;
    color: var(--azul-escuro);
    margin-top: 4px;
  }

  .seta {
    display: inline-block;
    font-size: 26px;
    transition: transform .3s;
    filter: drop-shadow(0 1px 1px rgba(11, 61, 92, .2));
  }

  .onda .seta {
    color: var(--azul-escuro);
  }

  .agora .bloco .seta {
    font-size: 19px;
    vertical-align: middle;
  }

  .horas {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 4px 4px 10px;
  }

  .hora {
    flex: 0 0 auto;
    width: 112px;
    text-align: center;
    background: #fafbfc;
    border: 1px solid #e8ecf1;
    border-radius: 18px;
    padding: 12px 8px;
    font-size: 12px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }

  .hora:hover {
    border-color: var(--azul-claro);
  }

  .hora.atual {
    background: linear-gradient(150deg, var(--azul-escuro), var(--azul-claro));
    color: white;
    border-color: transparent;
    transform: translateY(-3px);
    box-shadow: 0 8px 18px rgba(11, 61, 92, .35);
  }

  .hora .dia {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--azul-escuro);
    background: rgba(11, 61, 92, .08);
    padding: 2px 9px;
    border-radius: 20px;
    margin-bottom: 6px;
  }

  .hora.atual .dia {
    color: white;
    background: rgba(255, 255, 255, .22);
  }

  .hora .h {
    font-weight: 800;
    font-size: 15px;
    margin-bottom: 6px;
  }

  .hora .seta {
    font-size: 17px;
    vertical-align: middle;
  }

  .hora .clima-icone {
    font-size: 25px;
    margin: 2px 0;
  }

  .hora .temp {
    font-weight: 800;
    font-size: 16px;
    margin: 2px 0 9px;
  }

  .hora .vento-linha {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-weight: 700;
  }

  .hora .rajada-mini {
    margin-top: 4px;
    font-size: 11px;
    opacity: .8;
  }

  .hora .onda-mini {
    margin-top: 6px;
    font-size: 11px;
    opacity: .9;
  }

  .pesca-titulo {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .02em;
    color: var(--azul-escuro);
    margin: 18px 0 10px;
  }

  .pesca {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .pesca-card {
    border-radius: 18px;
    padding: 14px 8px;
    color: white;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .14), inset 0 1px 0 rgba(255, 255, 255, .2);
  }

  .pesca-card .periodo {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .04em;
    background: rgba(255, 255, 255, .2);
    padding: 3px 11px;
    border-radius: 20px;
  }

  .pesca-card .icone {
    font-size: 24px;
    width: 46px;
    height: 46px;
    margin: 8px auto 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, .18);
    border-radius: 50%;
  }

  .pesca-card .status {
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 4px;
    line-height: 1.25;
  }

  .pesca-card .temp-media {
    font-size: 16px;
    font-weight: 800;
    margin-top: 4px;
  }

  .pesca-card .clima-media {
    font-size: 12.5px;
    opacity: .95;
    margin-top: 2px;
  }

  .pesca-card .vento-medio {
    font-size: 12.5px;
    opacity: .95;
    margin-top: 4px;
  }

  .pesca-card .onda-media {
    font-size: 14px;
    font-weight: 800;
    margin-top: 4px;
  }

  .pesca-card.boa {
    background: linear-gradient(150deg, #0e7c3f, #34c974);
  }

  .pesca-card.media {
    background: linear-gradient(150deg, #a8710f, #f2b705);
  }

  .pesca-card.ruim {
    background: linear-gradient(150deg, #7c1414, #e74c3c);
  }

  .pesca-card.indisponivel {
    background: linear-gradient(150deg, #666, #999);
  }

  .carregando, .erro {
    text-align: center;
    padding: 30px 10px;
    color: #7a8794;
    font-weight: 600;
  }

  .erro {
    color: #c0392b;
  }

  .atualizado {
    font-size: 11.5px;
    color: #9aa5b1;
    text-align: right;
    margin-top: 12px;
    font-weight: 600;
  }

  @media (max-width: 340px) {
    .agora {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<header>
  <button id="botaoMenu" class="botao-menu" aria-label="Mudar de local">☰</button>
  <h1>🌬️ Tempo Pesca de Caiaque</h1>
</header>

<div id="overlayMenu" class="overlay-menu"></div>

<nav id="menuLocais" class="menu-locais">
  <div class="menu-locais-titulo">Locais</div>
  <div id="listaLocais"></div>
</nav>

<div class="container">
  <div class="lugar" id="conteudoLugar"></div>
</div>

<script>

// ============================================================
// LUGARES — edite esta lista para adicionar/remover pontos.
// nome: texto exibido | lat/lon: coordenadas decimais
// ============================================================
const LUGARES = [
  { nome: "Represa das Palmeiras", lat: -26.6010169, lon: -49.3383111 },
  { nome: "Represa da Volta Grande", lat: -26.5756963, lon: -49.6210056 },
  { nome: "Represa do Pinhal", lat: -26.6184874, lon: -49.4088677 },
  { nome: "Ilhas do Itacolomi", lat: -26.7106766, lon: -48.6179942 },
  { nome: "Ilha Feia", lat: -26.7450364, lon: -48.6329146 },
  { nome: "Laje Grande", lat: -26.6622667, lon: -48.6559333 },
  { nome: "Laje do Cação", lat: -26.7803833, lon: -48.5715833 },
  { nome: "Tamboretes", lat: -26.3791, lon: -48.51795 },
];

const DIAS_PREVISAO = 7; // hoje + 6 dias

// Pescador de caiaque não pesca de noite, e mostrar hora a hora dava
// cards demais pra rolar — a faixa de horários mostra só esses horários
// do dia, de 3 em 3 horas.
const HORAS_DE_PESCA = [6, 9, 12, 15, 18];

// Em pontos no mar, onda média acima disso inviabiliza a pesca,
// independente do vento.
const LIMITE_ONDA_PESCA_M = 0.6;

// 7 dias (hoje + 6) x 5 horários por dia
const HORAS_EXIBIDAS = DIAS_PREVISAO * HORAS_DE_PESCA.length;
const ATUALIZA_A_CADA_MS = 15 * 60 * 1000; // 15 min

// Códigos de tempo (WMO) usados pela Open-Meteo — https://open-meteo.com/en/docs
const CLIMA = {
  0: { icone: "☀️", texto: "Céu limpo" },
  1: { icone: "🌤️", texto: "Poucas nuvens" },
  2: { icone: "⛅", texto: "Parcialmente nublado" },
  3: { icone: "☁️", texto: "Nublado" },
  45: { icone: "🌫️", texto: "Neblina" },
  48: { icone: "🌫️", texto: "Neblina" },
  51: { icone: "🌦️", texto: "Garoa fraca" },
  53: { icone: "🌦️", texto: "Garoa" },
  55: { icone: "🌦️", texto: "Garoa forte" },
  56: { icone: "🌧️", texto: "Garoa congelante" },
  57: { icone: "🌧️", texto: "Garoa congelante" },
  61: { icone: "🌧️", texto: "Chuva fraca" },
  63: { icone: "🌧️", texto: "Chuva" },
  65: { icone: "🌧️", texto: "Chuva forte" },
  66: { icone: "🌧️", texto: "Chuva congelante" },
  67: { icone: "🌧️", texto: "Chuva congelante" },
  71: { icone: "🌨️", texto: "Neve fraca" },
  73: { icone: "🌨️", texto: "Neve" },
  75: { icone: "🌨️", texto: "Neve forte" },
  77: { icone: "🌨️", texto: "Grãos de neve" },
  80: { icone: "🌦️", texto: "Pancadas de chuva" },
  81: { icone: "🌦️", texto: "Pancadas de chuva" },
  82: { icone: "🌧️", texto: "Pancadas fortes" },
  85: { icone: "🌨️", texto: "Pancadas de neve" },
  86: { icone: "🌨️", texto: "Pancadas de neve" },
  95: { icone: "⛈️", texto: "Trovoada" },
  96: { icone: "⛈️", texto: "Trovoada com granizo" },
  99: { icone: "⛈️", texto: "Trovoada com granizo" },
};

function infoClima(codigo) {
  return CLIMA[codigo] || { icone: "🌡️", texto: "—" };
}

function formatarHora(isoLocal) {
  // Open-Meteo com timezone=auto retorna "AAAA-MM-DDTHH:MM" já em hora local
  return isoLocal.slice(11, 16);
}

function formatarDia(isoLocal) {
  const dataLinha = isoLocal.slice(0, 10); // "AAAA-MM-DD"

  const hoje = new Date();
  const pad = n => String(n).padStart(2, "0");
  const dataHoje = `${hoje.getFullYear()}-${pad(hoje.getMonth() + 1)}-${pad(hoje.getDate())}`;

  if (dataLinha === dataHoje) return "Hoje";

  const [, mes, dia] = dataLinha.split("-");
  return `${dia}/${mes}`;
}

function horaAtualISO() {
  const agora = new Date();
  agora.setMinutes(0, 0, 0);
  const pad = n => String(n).padStart(2, "0");
  return `${agora.getFullYear()}-${pad(agora.getMonth() + 1)}-${pad(agora.getDate())}T${pad(agora.getHours())}:00`;
}

async function buscarJSON(url) {
  const resposta = await fetch(url);
  if (!resposta.ok) {
    throw new Error(`HTTP ${resposta.status}`);
  }
  return resposta.json();
}

async function buscarVento(lat, lon) {
  const url =
    `https://api.open-meteo.com/v1/forecast` +
    `?latitude=${lat}&longitude=${lon}` +
    `&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m,temperature_2m,weather_code` +
    `&wind_speed_unit=kmh&timezone=auto&forecast_days=${DIAS_PREVISAO}`;

  return buscarJSON(url);
}

async function buscarOndas(lat, lon) {
  const url =
    `https://marine-api.open-meteo.com/v1/marine` +
    `?latitude=${lat}&longitude=${lon}` +
    `&hourly=wave_height,wave_direction,wave_period` +
    `&timezone=auto&forecast_days=${DIAS_PREVISAO}`;

  try {
    return await buscarJSON(url);
  } catch (erro) {
    return null;
  }
}

function temDadosDeOnda(dadosOndas) {
  if (!dadosOndas || !dadosOndas.hourly) return false;
  const alturas = dadosOndas.hourly.wave_height || [];
  return alturas.some(v => v !== null && v !== undefined);
}

function dentroDoHorarioDePesca(isoLocal) {
  const hora = Number(isoLocal.slice(11, 13));
  return HORAS_DE_PESCA.includes(hora);
}

function montarLinhasHorarias(dadosVento, dadosOndas) {
  const horas = dadosVento.hourly.time;
  const agora = horaAtualISO();

  const linhas = [];
  for (let i = 0; i < horas.length && linhas.length < HORAS_EXIBIDAS; i++) {
    if (horas[i] < agora) continue;
    if (!dentroDoHorarioDePesca(horas[i])) continue;

    linhas.push({
      hora: horas[i],
      velocidade: dadosVento.hourly.wind_speed_10m[i],
      direcao: dadosVento.hourly.wind_direction_10m[i],
      rajada: dadosVento.hourly.wind_gusts_10m[i],
      temperatura: dadosVento.hourly.temperature_2m[i],
      codigoClima: dadosVento.hourly.weather_code[i],
      ondaAltura: dadosOndas ? dadosOndas.hourly.wave_height[i] : null,
      ondaDirecao: dadosOndas ? dadosOndas.hourly.wave_direction[i] : null,
      ondaPeriodo: dadosOndas ? dadosOndas.hourly.wave_period[i] : null,
    });
  }
  return linhas;
}

function htmlAgora(linha, ehMar) {
  const setaVento = `<span class="seta" style="transform: rotate(${linha.direcao + 180}deg)">↑</span>`;
  const clima = infoClima(linha.codigoClima);

  let blocos = `
    <div class="bloco">
      <div class="rotulo">Vento</div>
      <div class="valor">${setaVento} ${Math.round(linha.velocidade)} km/h</div>
    </div>
    <div class="bloco">
      <div class="rotulo">${clima.texto}</div>
      <div class="valor">${clima.icone} ${Math.round(linha.temperatura)}°C</div>
    </div>
    <div class="bloco">
      <div class="rotulo">Rajadas</div>
      <div class="valor">${Math.round(linha.rajada)} km/h</div>
    </div>
  `;

  if (ehMar && linha.ondaAltura !== null) {
    const setaOnda = `<span class="seta onda" style="transform: rotate(${linha.ondaDirecao + 180}deg)">↑</span>`;
    blocos += `
      <div class="bloco">
        <div class="rotulo">Ondas</div>
        <div class="valor">${setaOnda} ${linha.ondaAltura.toFixed(1)} m</div>
      </div>
      <div class="bloco">
        <div class="rotulo">Período</div>
        <div class="valor">${Math.round(linha.ondaPeriodo)} s</div>
      </div>
    `;
  }

  return `<div class="agora">${blocos}</div>`;
}

// ============================================================
// PESCABILIDADE — vento médio da manhã (6h-12h) e da tarde (13h-18h)
// do dia atualmente selecionado na faixa de horas (ver selecionarHora).
// ============================================================

function resumoPeriodo(dadosVento, dataAlvo, horaInicio, horaFim) {
  const { time, wind_speed_10m, temperature_2m, weather_code } = dadosVento.hourly;

  const velocidades = [];
  const temperaturas = [];
  const contagemClima = {};

  for (let i = 0; i < time.length; i++) {
    const [data, horaTexto] = time[i].split("T");
    if (data !== dataAlvo) continue;

    const hora = Number(horaTexto.slice(0, 2));
    if (hora < horaInicio || hora > horaFim) continue;

    if (wind_speed_10m[i] !== null) velocidades.push(wind_speed_10m[i]);
    if (temperature_2m[i] !== null) temperaturas.push(temperature_2m[i]);
    if (weather_code[i] !== null && weather_code[i] !== undefined) {
      contagemClima[weather_code[i]] = (contagemClima[weather_code[i]] || 0) + 1;
    }
  }

  const media = valores => valores.length
    ? valores.reduce((soma, v) => soma + v, 0) / valores.length
    : null;

  let codigoPredominante = null;
  let maiorContagem = 0;
  for (const codigo in contagemClima) {
    if (contagemClima[codigo] > maiorContagem) {
      maiorContagem = contagemClima[codigo];
      codigoPredominante = Number(codigo);
    }
  }

  return {
    ventoMedio: media(velocidades),
    temperaturaMedia: media(temperaturas),
    clima: codigoPredominante !== null ? infoClima(codigoPredominante) : null,
  };
}

function classificarPesca(mediaVelocidade, ondaMedia) {
  // No mar, onda grande inviabiliza a pesca mesmo com pouco vento.
  if (ondaMedia !== null && ondaMedia !== undefined && ondaMedia > LIMITE_ONDA_PESCA_M) {
    return { classe: "ruim", icone: "🚫", texto: "Não pescável, mar agitado" };
  }

  if (mediaVelocidade === null) {
    return { classe: "indisponivel", icone: "❓", texto: "Sem dados suficientes" };
  }
  if (mediaVelocidade < 6) {
    return { classe: "boa", icone: "🎣", texto: "Pescável, quase sem vento" };
  }
  if (mediaVelocidade <= 12) {
    return { classe: "media", icone: "🎣", texto: "Pescável, com pouco vento" };
  }
  return { classe: "ruim", icone: "🚫", texto: "Não pescável" };
}

function ondaMediaNoPeriodo(dadosOndas, dataAlvo, horaInicio, horaFim) {
  if (!dadosOndas || !dadosOndas.hourly) return null;

  const { time, wave_height } = dadosOndas.hourly;
  const alturas = [];

  for (let i = 0; i < time.length; i++) {
    const [data, horaTexto] = time[i].split("T");
    if (data !== dataAlvo) continue;

    const hora = Number(horaTexto.slice(0, 2));
    if (hora < horaInicio || hora > horaFim) continue;

    if (wave_height[i] !== null && wave_height[i] !== undefined) {
      alturas.push(wave_height[i]);
    }
  }

  if (alturas.length === 0) return null;
  return alturas.reduce((soma, v) => soma + v, 0) / alturas.length;
}

function calcularPeriodoPesca(dadosVento, dadosOndas, dataAlvo, horaInicio, horaFim) {
  const resumo = resumoPeriodo(dadosVento, dataAlvo, horaInicio, horaFim);
  const ondaMedia = ondaMediaNoPeriodo(dadosOndas, dataAlvo, horaInicio, horaFim);

  return {
    data: dataAlvo,
    media: resumo.ventoMedio,
    temperaturaMedia: resumo.temperaturaMedia,
    clima: resumo.clima,
    ondaMedia,
    ...classificarPesca(resumo.ventoMedio, ondaMedia),
  };
}

function htmlCardPesca(rotulo, periodo) {
  const ondaHtml = periodo.ondaMedia !== null
    ? `<div class="onda-media">🌊 Onda média: ${periodo.ondaMedia.toFixed(1)} m</div>`
    : "";

  const temperaturaHtml = periodo.temperaturaMedia !== null
    ? `<div class="temp-media">${Math.round(periodo.temperaturaMedia)}°C</div>`
    : "";

  const climaHtml = periodo.clima
    ? `<div class="clima-media">${periodo.clima.icone} ${periodo.clima.texto}</div>`
    : "";

  const ventoHtml = periodo.media !== null
    ? `<div class="vento-medio">Vento médio: ${Math.round(periodo.media)} km/h</div>`
    : "";

  return `
    <div class="pesca-card ${periodo.classe}">
      <div class="periodo">${rotulo}</div>
      <div class="icone">${periodo.icone}</div>
      <div class="status">${periodo.texto}</div>
      ${ondaHtml}
      ${temperaturaHtml}
      ${climaHtml}
      ${ventoHtml}
    </div>
  `;
}

function htmlGradePesca(periodoManha, periodoTarde) {
  return `
    <div class="pesca">
      ${htmlCardPesca("Manhã", periodoManha)}
      ${htmlCardPesca("Tarde", periodoTarde)}
    </div>
  `;
}

function htmlTituloPescabilidade(periodo) {
  const dataTexto = periodo && periodo.data
    ? ` · ${formatarDia(`${periodo.data}T00:00`)}`
    : "";

  return `<div class="pesca-titulo">🎣 Pescabilidade${dataTexto}</div>`;
}

function htmlPescabilidade(periodoManha, periodoTarde) {
  return `
    ${htmlTituloPescabilidade(periodoManha)}
    ${htmlGradePesca(periodoManha, periodoTarde)}
  `;
}

function htmlHoras(linhas, ehMar, selecionado) {
  const cartoes = linhas.map((linha, indice) => {
    const seta = `<span class="seta" style="transform: rotate(${linha.direcao + 180}deg)">↑</span>`;
    const clima = infoClima(linha.codigoClima);
    const onda = (ehMar && linha.ondaAltura !== null)
      ? `<div class="onda-mini">🌊 ${linha.ondaAltura.toFixed(1)}m</div>`
      : "";

    return `
      <div class="hora ${indice === selecionado ? "atual" : ""}" data-indice="${indice}">
        <div class="dia">${formatarDia(linha.hora)}</div>
        <div class="h">${formatarHora(linha.hora)}</div>
        <div class="clima-icone">${clima.icone}</div>
        <div class="temp">${Math.round(linha.temperatura)}°C</div>
        <div class="vento-linha">${seta} ${Math.round(linha.velocidade)} km/h</div>
        <div class="rajada-mini">Rajada ${Math.round(linha.rajada)} km/h</div>
        ${onda}
      </div>
    `;
  }).join("");

  return `<div class="horas">${cartoes}</div>`;
}

// Estado por lugar (mesmo índice de LUGARES): dados já buscados + qual
// hora está selecionada no momento. Clicar num card de hora só troca a
// seleção e redesenha — não busca dados de novo na API.
const ESTADO = [];

// Todos os lugares são buscados em segundo plano (ver carregarTudo), mas
// só o lugar "ativo" é desenhado na tela — trocar pelo menu lateral é
// instantâneo quando os dados já foram carregados.
let ativo = 0;

function montarMenuLocais() {
  const lista = document.getElementById("listaLocais");
  lista.innerHTML = LUGARES.map((lugar, indice) => `
    <button class="local-item ${indice === ativo ? "ativo" : ""}" data-indice="${indice}">
      ${lugar.nome}
    </button>
  `).join("");

  lista.querySelectorAll(".local-item").forEach(botao => {
    botao.addEventListener("click", () => {
      mudarLugarAtivo(Number(botao.dataset.indice));
      fecharMenu();
    });
  });
}

function abrirMenu() {
  document.getElementById("menuLocais").classList.add("aberto");
  document.getElementById("overlayMenu").classList.add("aberto");
}

function fecharMenu() {
  document.getElementById("menuLocais").classList.remove("aberto");
  document.getElementById("overlayMenu").classList.remove("aberto");
}

function mudarLugarAtivo(indice) {
  if (indice === ativo) return;

  ativo = indice;
  montarMenuLocais();

  if (ESTADO[indice]) {
    renderizarLugar(indice);
  } else {
    document.getElementById("conteudoLugar").innerHTML =
      `<div class="carregando">Carregando ${LUGARES[indice].nome}...</div>`;
  }
}

function renderizarLugar(indiceLugar) {
  if (indiceLugar !== ativo) return;

  const lugar = LUGARES[indiceLugar];
  const estado = ESTADO[indiceLugar];
  const elemento = document.getElementById("conteudoLugar");
  if (!estado || !elemento) return;

  const linhaSelecionada = estado.linhas[estado.selecionado];

  elemento.innerHTML = `
    <h2>${lugar.nome}</h2>
    ${htmlAgora(linhaSelecionada, estado.ehMar)}
    ${htmlHoras(estado.linhas, estado.ehMar, estado.selecionado)}
    ${htmlPescabilidade(estado.periodoManha, estado.periodoTarde)}
    <div class="atualizado">Atualizado às ${estado.atualizadoEm}</div>
  `;

  elemento.querySelectorAll(".hora").forEach(cartaoHora => {
    cartaoHora.addEventListener("click", () => {
      selecionarHora(indiceLugar, Number(cartaoHora.dataset.indice));
    });
  });
}

// Troca só a hora selecionada: atualiza o bloco "agora", os cards de
// pescabilidade (recalculados para o dia da hora escolhida) e a
// marcação do card selecionado — sem redesenhar a faixa de horas, pra
// não perder a posição de rolagem que o usuário já tinha feito.
function selecionarHora(indiceLugar, indiceHora) {
  if (indiceLugar !== ativo) return;

  const estado = ESTADO[indiceLugar];
  const elemento = document.getElementById("conteudoLugar");
  if (!estado || !elemento) return;

  estado.selecionado = indiceHora;

  const blocoAgora = elemento.querySelector(".agora");
  if (blocoAgora) {
    blocoAgora.outerHTML = htmlAgora(estado.linhas[indiceHora], estado.ehMar);
  }

  const dataSelecionada = estado.linhas[indiceHora].hora.slice(0, 10);
  estado.periodoManha = calcularPeriodoPesca(estado.dadosVentoCompleto, estado.dadosOndasCompleto, dataSelecionada, 6, 12);
  estado.periodoTarde = calcularPeriodoPesca(estado.dadosVentoCompleto, estado.dadosOndasCompleto, dataSelecionada, 13, 18);

  const tituloPesca = elemento.querySelector(".pesca-titulo");
  if (tituloPesca) {
    tituloPesca.outerHTML = htmlTituloPescabilidade(estado.periodoManha);
  }

  const blocoPesca = elemento.querySelector(".pesca");
  if (blocoPesca) {
    blocoPesca.outerHTML = htmlGradePesca(estado.periodoManha, estado.periodoTarde);
  }

  elemento.querySelectorAll(".hora").forEach(cartaoHora => {
    cartaoHora.classList.toggle("atual", Number(cartaoHora.dataset.indice) === indiceHora);
  });
}

async function carregarLugar(indiceLugar) {
  const lugar = LUGARES[indiceLugar];

  try {
    const [dadosVento, dadosOndas] = await Promise.all([
      buscarVento(lugar.lat, lugar.lon),
      buscarOndas(lugar.lat, lugar.lon),
    ]);

    const ehMar = temDadosDeOnda(dadosOndas);
    const linhas = montarLinhasHorarias(dadosVento, ehMar ? dadosOndas : null);

    if (linhas.length === 0) {
      throw new Error("Sem dados horários disponíveis");
    }

    const dataInicial = linhas[0].hora.slice(0, 10);
    const dadosOndasCompleto = ehMar ? dadosOndas : null;

    ESTADO[indiceLugar] = {
      linhas,
      dadosVentoCompleto: dadosVento,
      dadosOndasCompleto,
      ehMar,
      selecionado: 0,
      periodoManha: calcularPeriodoPesca(dadosVento, dadosOndasCompleto, dataInicial, 6, 12),
      periodoTarde: calcularPeriodoPesca(dadosVento, dadosOndasCompleto, dataInicial, 13, 18),
      atualizadoEm: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
    };

    renderizarLugar(indiceLugar);
  } catch (erro) {
    if (indiceLugar !== ativo) return;

    document.getElementById("conteudoLugar").innerHTML = `
      <h2>${lugar.nome}</h2>
      <div class="erro">❌ Erro ao carregar previsão: ${erro.message}</div>
    `;
  }
}

function carregarTudo() {
  LUGARES.forEach((lugar, indice) => carregarLugar(indice));
}

function montarPagina() {
  montarMenuLocais();
  document.getElementById("conteudoLugar").innerHTML =
    `<div class="carregando">Carregando ${LUGARES[ativo].nome}...</div>`;

  document.getElementById("botaoMenu").addEventListener("click", abrirMenu);
  document.getElementById("overlayMenu").addEventListener("click", fecharMenu);
}

montarPagina();
carregarTudo();
setInterval(carregarTudo, ATUALIZA_A_CADA_MS);

</script>
